<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tile { fill: #1e66f5; }
    .glyph { stroke: #eff1f5; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #8aadf4; }
      .glyph { stroke: #24273a; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14" />
  <g class="glyph" fill="none" stroke-width="7" stroke-linecap="round">
    <circle cx="32" cy="32" r="15" />
    <line x1="15" y1="49" x2="49" y2="15" />
  </g>
</svg>
